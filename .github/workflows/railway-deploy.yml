name: Railway Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Railway CLI
              run: npm install -g @railway/cli

            - name: Deploy API
              run: railway up --service hnh-backend-api --detach
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              continue-on-error: true

            - name: Deploy Stratum Proxy
              run: railway up --service hnh-backend-stratum --detach
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              continue-on-error: true
