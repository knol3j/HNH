name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Install backend API dependencies
        working-directory: backend/api
        run: npm ci

      - name: Run backend API tests
        working-directory: backend/api
        run: npm test

      - name: Install agent dependencies
        working-directory: agent
        run: npm ci

      - name: Run agent tests
        working-directory: agent
        run: npm test

      - name: Install stratum dependencies
        working-directory: backend/stratum
        run: npm ci

      - name: Run stratum tests
        working-directory: backend/stratum
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: 'https://api.hashnhedge.com'
        run: npm run build

      - name: Verify build output
        run: ls -la dist/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
