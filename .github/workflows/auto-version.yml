name: Auto-Version Agent Miner

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '!agent/node_modules/**'
      - '!agent/release/**'
      - '!agent/bin/**'
      - '!agent/bin_backup/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Skip if the commit was made by this workflow (prevents infinite loop)
    if: "!contains(github.event.head_commit.message, '[auto-version]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for agent changes
        id: changes
        run: |
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -n "$BASE_SHA" ]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- 'agent/' | grep -v 'node_modules/' | grep -v 'release/' | grep -v 'bin/' | grep -v 'bin_backup/' || true)
          else
            CHANGED=$(git ls-files 'agent/' | grep -v 'node_modules/' | grep -v 'release/' | grep -v 'bin/' | grep -v 'bin_backup/' || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No agent file changes detected."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Agent files changed:"
            echo "$CHANGED"
          fi

      - name: Calculate next agent version
        if: steps.changes.outputs.has_changes == 'true'
        id: bump
        run: |
          CURRENT=$(node -e "const v = JSON.parse(require('fs').readFileSync('version.json','utf8')); console.log(v.agentVersion || v.version)")
          echo "Current version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "New version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Tag release without mutating main
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          TAG="v${{ steps.bump.outputs.NEW_VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "✅ Tagged $TAG from $GITHUB_SHA — release workflow will publish automatically"
